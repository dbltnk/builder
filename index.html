<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STREAMS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="screen-game" class="screen">
    <header class="topbar">
      <button id="btn-rotate" class="icon-btn" type="button" title="rotate hovered">rot [r]</button>
      <button id="btn-delete" class="icon-btn" type="button" title="delete hovered">del [d]</button>
      <button id="btn-clear" class="icon-btn" type="button" title="clear board">clear [bksp]</button>
      <button id="btn-undo" class="icon-btn" type="button" title="undo">undo [z]</button>
      <button id="btn-redo" class="icon-btn" type="button" title="redo">redo [x]</button>
      <div id="level-title" class="level-title">sandbox</div>
      <div class="metrics-readout">
        <span class="metric"><label>time</label><b id="m-time">0</b></span>
        <span class="metric"><label>dots</label><b id="m-dots">0</b></span>
        <span class="metric"><label>fps</label><b id="m-fps">—</b></span>
      </div>
    </header>

    <aside class="sidebar sidebar-left">
      <div class="sidebar-title">PALETTE</div>
      <div id="palette"></div>
      <div class="trash" id="trash">drop here<br>to delete</div>
    </aside>

    <main class="board-wrap">
      <div id="board-stack" class="board-stack">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <canvas id="particles-canvas" class="particles-canvas"></canvas>
      </div>
    </main>

    <aside class="sidebar sidebar-right">
      <div class="sidebar-title">TILE</div>
      <div id="tile-inspector" class="tile-inspector"></div>
      <div class="sidebar-title">GOALS</div>
      <div id="task" class="task-panel"></div>
      <div class="sidebar-title">STATS</div>
      <div id="stats" class="stats-panel"></div>
    </aside>

    <footer class="bottombar">
      <button id="btn-reset" class="ctl-btn ctl-reset" type="button">reset sim [q]</button>
      <button id="btn-play" class="ctl-btn ctl-play" type="button">▶ play [space]</button>
      <span class="speed-picker">
        <span class="speed-label">speed [-/+]</span>
        <button type="button" class="spd-btn active" data-speed="1">×1</button>
        <button type="button" class="spd-btn" data-speed="2">×2</button>
        <button type="button" class="spd-btn" data-speed="3">×3</button>
        <button type="button" class="spd-btn" data-speed="5">×5</button>
        <button type="button" class="spd-btn" data-speed="8">×8</button>
        <button type="button" class="spd-btn" data-speed="13">×13</button>
        <button type="button" class="spd-btn" data-speed="21">×21</button>
        <button type="button" class="spd-btn" data-speed="34">×34</button>
        <button type="button" class="spd-btn" data-speed="55">×55</button>
      </span>
    </footer>
  </div>

  <script src="src/particles-app.js"></script>
</body>
</html>
