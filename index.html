<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCE - Moebius Construction Environment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="screen-game" class="screen" tabindex="-1" autofocus>
    <header class="topbar">
      <div class="tool-picker" role="toolbar" aria-label="transform tools">
        <button id="tool-move" type="button" class="tool-btn active" title="Move [w]">move [w]</button>
        <button id="tool-rotate" type="button" class="tool-btn" title="Rotate [e]">rotate [e]</button>
        <button id="tool-scale" type="button" class="tool-btn" title="Scale [r]">scale [r]</button>
      </div>
      <button id="btn-rotate" class="icon-btn" type="button" title="rotate hovered 90°">rot 90°</button>
      <button id="btn-delete" class="icon-btn" type="button" title="delete hovered">del [d]</button>
      <button id="btn-undo" class="icon-btn" type="button" title="undo">undo [z]</button>
      <button id="btn-redo" class="icon-btn" type="button" title="redo">redo [x]</button>
      <div id="level-title" class="level-title">MCE - Moebius Construction Environment</div>
    </header>

    <aside class="sidebar sidebar-left">
      <div class="sidebar-title">PALETTE</div>
      <div id="palette"></div>
      <div class="trash" id="trash">drop here<br>to delete</div>
    </aside>

    <main class="board-wrap">
      <div id="board-stack" class="board-stack">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <canvas id="particles-canvas" class="particles-canvas"></canvas>
      </div>
    </main>

    <aside class="sidebar sidebar-right">
      <div id="tile-inspector" class="tile-inspector"></div>
    </aside>

    <footer class="bottombar">
      <div class="bottombar-left">
        <button id="btn-clear" class="ctl-btn" type="button">clear [bksp]</button>
        <button id="btn-reset" class="ctl-btn" type="button">reset particles [q]</button>
      </div>
      <button id="btn-play" class="ctl-btn ctl-play" type="button">▶ play [space]</button>
      <span class="speed-picker">
        <span class="speed-label">speed [-/+]</span>
        <button type="button" class="spd-btn" data-speed="0.1">×0.1</button>
        <button type="button" class="spd-btn active" data-speed="1">×1</button>
        <button type="button" class="spd-btn" data-speed="10">×10</button>
        <button type="button" class="spd-btn" data-speed="100">×100</button>
      </span>
      <div class="score-pop-wrap" title="Simulation stats (hover or focus)">
        <button type="button" class="score-pop-icon" aria-label="Simulation stats" aria-controls="stats">
          <svg class="score-pop-glyph" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M2 14h2V8H2v6zm5 0h2V4H7v10zm5 0h2v-8h-2v8z"/>
          </svg>
        </button>
        <div id="stats" class="stats-panel score-pop-panel" role="region" aria-label="Simulation stats"></div>
      </div>
    </footer>
  </div>

  <script src="src/particles-app.js"></script>
</body>
</html>
